name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    # macOS has no runner on this account's plan, so it is not in the matrix; macOS users build the addon from source on
    # install (the package's prepare step does that with their own toolchain).
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cargo build --release -p optimisemd-node
      - name: stage the addon
        shell: bash
        run: |
          mkdir -p native
          case "${{ runner.os }}" in
            Linux) cp target/release/liboptimisemd_node.so native/dsh-optimisemd.linux-x64.node ;;
            macOS) cp target/release/liboptimisemd_node.dylib native/dsh-optimisemd.darwin-arm64.node ;;
            Windows) cp target/release/optimisemd_node.dll native/dsh-optimisemd.win32-x64.node ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-optimisemd-${{ matrix.target }}
          path: native/*.node

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: native
          pattern: dsh-optimisemd-*
          merge-multiple: true
      - name: attach the addons to the release
        uses: softprops/action-gh-release@v2
        with:
          files: native/*.node
          generate_release_notes: true
