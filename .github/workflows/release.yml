name: release

on:
  push:
    tags: ["v*"]

jobs:
  # Every release carries code that passed: the same gates CI runs, including the node tests on
  # Windows (the win32 addon ships to users, so its host tests run on Windows too).
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    # The gate tests need a POSIX shell: fail loudly if the image loses one instead of skipping.
    env:
      REQUIRE_SHELL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - run: pnpm install
      - run: pnpm build
      - run: pnpm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    # macOS has no runner on this account's plan, so it is not in the matrix; the macOS addon is
    # built on the owner's Mac from the tag and uploaded to the same release.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cargo build --release -p optimisemd-node
      - name: stage the addon
        shell: bash
        run: |
          mkdir -p native
          case "${{ runner.os }}" in
            Linux) cp target/release/liboptimisemd_node.so native/dsh-optimisemd.linux-x64.node ;;
            macOS) cp target/release/liboptimisemd_node.dylib native/dsh-optimisemd.darwin-arm64.node ;;
            Windows) cp target/release/optimisemd_node.dll native/dsh-optimisemd.win32-x64.node ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-optimisemd-${{ matrix.target }}
          path: native/*.node

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: native
          pattern: dsh-optimisemd-*
          merge-multiple: true
      - name: the tag matches the package version
        shell: bash
        run: |
          want="v$(node -p "require('./package.json').version")"
          got="${GITHUB_REF_NAME}"
          if [ "$want" != "$got" ]; then
            echo "tag $got does not match the package version $want"
            exit 1
          fi
      - name: attach the addons to the release
        uses: softprops/action-gh-release@v2
        with:
          files: native/*.node
          generate_release_notes: true
