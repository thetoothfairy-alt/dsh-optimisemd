[package]
name = "optimisemd-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
optimisemd-core = { path = "../optimisemd-core" }
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
serde_json = "1"

[build-dependencies]
napi-build = "2"
