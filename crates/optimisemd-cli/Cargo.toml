[package]
name = "optimisemd-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dsh-optimisemd"
path = "src/main.rs"

[dependencies]
optimisemd-core = { path = "../optimisemd-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
